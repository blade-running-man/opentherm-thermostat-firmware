; OpenTherm thermostat firmware.
;
; framework = espidf, and the word arduino appears in no environment of this file.
; Acceptance criterion 3 is checked by grepping for exactly that.

[env:lolin_c3_mini]
; PINNED, and the pin carries load. A bare git URL floats here: in the original project the
; first build cloned whatever was on the default branch, and the toolchain moved out from
; under a design document verified against a different tree. Move it deliberately, having
; rechecked the phase 0 checks, and say so.
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.311
framework = espidf
board = lolin_c3_mini
board_build.partitions = partitions.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; The host suites belong to [env:native] and must not be built for the board.
test_ignore = *
; The entity registry is generated from tools/opentherm_ids.py before every firmware
; build. DO NOT add this to [env:native]: the host tests must see the tree exactly as it
; is, otherwise the test for a divergence between the file and the render will not fire.
extra_scripts = pre:tools/regenerate.py
build_flags =
	-DPROJECT_NAME_STR=\"opentherm-thermostat\"

; ESP32-C6 SuperMini. The second target: the shield does not plug into it (the shield is
; in the D1 mini form factor), the connection is by wires, so the pin numbers are chosen by
; us. See components/board/board_supermini_c6.c.
;
; board = esp32-c6-devkitm-1, because there is no SuperMini definition in the platform
; catalogue. devkitm-1, and NOT devkitc-1: the two files are byte-for-byte identical
; everywhere except the flash -- devkitm-1 has 4 MB, devkitc-1 has 8 MB. A mistake here
; silently overstates the flash size and breaks the partition table. The board also exists
; with 8 MB under the same name: before the first flashing, check `esptool flash_id` on
; your own unit.
[env:supermini_c6]
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.311
framework = espidf
board = esp32-c6-devkitm-1
board_build.partitions = partitions.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
test_ignore = *
extra_scripts = pre:tools/regenerate.py
build_flags =
	-DPROJECT_NAME_STR=\"opentherm-thermostat\"

; The host suites. The protocol, climate and command layers depend neither on hardware nor
; on a framework, so they are tested natively -- and the test is written before the first
; line of the implementation.
[env:native]
platform = native
test_framework = unity
; One directory -- one suite: PlatformIO links all the .cpp files of a directory into one
; binary, so two main()s in one directory would collide.
test_filter = test_*
; src/ is the firmware entry point, it is not built on the host.
build_src_filter = -<*>
; The components are ESP-IDF components and PlatformIO libraries at the same time, so the
; host tests compile exactly the same sources the device executes.
lib_extra_dirs = components
; -Werror=switch: the components compile on the board without -Wall (ESP-IDF's build.cmake has it
; commented out), so THIS build is where an enumerator appended without its case is caught
; (ot_config_err_name, ot_config_strerror). It guards only what is host-built: ot_http is not.
build_flags =
	-std=c++17
	-Wall
	-Wextra
	-Werror=switch
	-I components/ot_json/include
	-I components/ot_lock/include
	-I components/ot_log/include
	-I components/ot_policy/include
	-I components/ot_secrets/include
	-I components/ot_auth/include
	-I components/ot_captive/include
	-I components/ot_provision/include
	-I components/ot_config/include
	-I components/ot_wire/include
	-I components/ot_frame/include
	-I components/ot_decode/include
	-I components/ot_encode/include
	-I components/ot_bus_sched/include
	-I components/ot_observe/include
	-I components/board/include
	-pthread
	-Wno-missing-field-initializers

